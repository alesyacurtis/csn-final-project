name: csn-final-project

services:
  dns-server:
    image: coredns/coredns:1.12.0
    
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile  

    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro
      - ./dns/zones/:/etc/coredns/zones/:ro

    networks:
      dns-lab:
        ipv4_address: 172.28.0.53

  dns-client:
    build:
      context: ./dns-client

    restart: unless-stopped
    init: true
    command: ["sh", "-c", "echo 'nameserver 172.28.0.53' > /etc/resolv.conf && sleep infinity"]
    depends_on:
      - dns-server

    networks:
      dns-lab:
        ipv4_address: 172.28.0.20

  backend1:
    image: nginx:stable-alpine
    restart: unless-stopped

    volumes:
      - ./backends/backend1:/usr/share/nginx/html:ro

    networks:
      dns-lab:
        ipv4_address: 172.28.0.11

  backend2:
    image: nginx:stable-alpine
    restart: unless-stopped

    volumes:
      - ./backends/backend2:/usr/share/nginx/html:ro

    networks:
      dns-lab:
        ipv4_address: 172.28.0.12

  backend3:
    image: nginx:stable-alpine
    restart: unless-stopped

    volumes:
      - ./backends/backend3:/usr/share/nginx/html:ro

    networks:
      dns-lab:
        ipv4_address: 172.28.0.13




networks:
  dns-lab:
    driver: bridge

    ipam:
      config:
        - subnet: 172.28.0.0/24
